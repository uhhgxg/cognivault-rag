# Modular RAG MCP Server - 配置文件
# 这是 MCP Server 的主配置文件。
# 编辑本文件可以配置 LLM、Embedding、向量库和其他服务。

# =============================================================================
# LLM 配置（大语言模型）
# =============================================================================
llm:
  provider: "openai"
  model: "qwen3.5-omni-flash"  # 阿里云百炼模型
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_key 会从 OPENAI_API_KEY 环境变量自动读取
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding 配置（向量编码模型）
# =============================================================================
embedding:
  provider: "openai"
  model: "text-embedding-v3"  # 阿里云百炼 Embedding 模型
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_key 会从 OPENAI_API_KEY 环境变量自动读取
  dimensions: 1536
  # OpenAI 专属设置（当 provider 为 openai 时可用）：
  # api_key: "YOUR_API_KEY_HERE"

# =============================================================================
# Vision LLM 配置（视觉大模型，用于图片描述）
# =============================================================================
vision_llm:
  enabled: true
  provider: "openai"
  model: "qwen3.5-omni-flash"  # 复用全模态模型做 OCR / 图片理解
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # api_key 会从 OPENAI_API_KEY 环境变量自动读取
  # Ollama 专属设置（当 provider 为 ollama 时可用）：
  # base_url: "http://localhost:11434"
  max_image_size: 2048  # 图片压缩后的最大边长（宽或高的最大值，单位像素）

# =============================================================================
# Vector Store 配置（向量数据库）
# =============================================================================
vector_store:
  provider: "chroma"  # 可选值：chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval 配置（检索参数）
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF 融合常数

# =============================================================================
# Rerank 配置（重排序）
# =============================================================================
rerank:
  enabled: true
  provider: "dashscope"  # 可选值：none, cross_encoder, dashscope, llm
  model: "qwen3-rerank"
  top_k: 5

# =============================================================================
# Evaluation 配置（评估体系）
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # 可选值：ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability 配置（可观测性 / 日志追踪）
# =============================================================================
observability:
  log_level: "INFO"  # 可选值：DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion 配置（摄取流水线）
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # 可选值：recursive, semantic, fixed_length
  batch_size: 100
  max_workers: 3  # Transform 阶段 LLM 调用的最大并发数

  # Chunk Refiner 配置（C5 文本块精炼）
  chunk_refiner:
    use_llm: true  # 设为 true 启用基于 LLM 的精炼（需要配置 LLM）
    # 当 use_llm 为 false 或 LLM 调用失败时，回退到基于规则的精炼

  # Metadata Enricher 配置（C6 元数据增强）
  metadata_enricher:
    use_llm: true  # 设为 true 启用基于 LLM 的增强（需要配置 LLM）
    # 当 use_llm 为 false 或 LLM 调用失败时，回退到基于规则的增强

# =============================================================================
# MCP Client 配置（外部工具服务器）
# =============================================================================
mcp_servers:
  # 简易 MCP Server（纯 Python 内置工具）
  simple:
    transport: stdio
    command: "python"
    args: ["scripts/simple_mcp_server.py", "--stdio"]
    timeout_seconds: 30

  # 示例：Tavily 网页搜索 MCP Server
  # tavily:
  #   transport: sse
  #   url: "http://localhost:3000/sse"
  #   timeout_seconds: 30

